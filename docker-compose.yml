version: '3.9'

services:
  app:
    build: .
    container_name: luma-salon-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/luma_salon
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: luma-salon-postgres
    environment:
      POSTGRES_DB: luma_salon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: luma-salon-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
